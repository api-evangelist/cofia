name: Cofia
description: 'Cofia is an AI automation platform that learns how a team actually works
  and automatically builds custom workflow automations without manual setup. By monitoring
  system events and recognizing repetitive patterns, Cofia proposes and assembles
  custom agents for tasks like prospect list building, outreach and follow-ups, recruiting
  pipeline management, and data report creation. The company markets itself as "AI
  automations that implement themselves." Cofia is a Y Combinator (Winter 2026) company
  based in New York City, founded by Moses Wayne (formerly Engineering Director at
  Duolingo) and Paola Martinez (formerly Senior Product Manager at Brilliant.org).
  It was added to the API Evangelist network as a portfolio-lead stub and enriched
  with what the company publishes publicly. As of this pass Cofia exposes no public
  developer API, OpenAPI specification, or documentation surface.'
